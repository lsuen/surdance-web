<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SurDance" />
    <!--
      iOS 主屏 WebApp：env(safe-area-inset-*) 在部分系统（含 26.x）standalone 会报 0。
      首屏绘制前挂上 standalone-webapp + 保底变量，避免顶栏钻灵动岛。
      底黑条：立刻给 html 沥青底 + 100vh（勿等 CSS；fixed 盖不到视口外孤儿条）。
    -->
    <script>
      (function () {
        try {
          var nav = window.navigator || {};
          var ua = nav.userAgent || "";
          var ios =
            /iPhone|iPad|iPod/i.test(ua) ||
            (nav.platform === "MacIntel" && nav.maxTouchPoints > 1);
          var standalone = nav.standalone === true;
          if (!standalone && window.matchMedia) {
            standalone = ["standalone", "fullscreen", "minimal-ui"].some(function (m) {
              return window.matchMedia("(display-mode: " + m + ")").matches;
            });
          }
          /* 开发机用 Safari 打开 :5173 不是 standalone，但 black-translucent+cover 仍会钻岛 */
          if (!standalone && !ios) return;
          var root = document.documentElement;
          if (standalone) root.classList.add("standalone-webapp");
          if (ios || standalone) root.classList.add("ios-safe");
          var st = root.style;
          if (!st.getPropertyValue("--safe-top")) st.setProperty("--safe-top", "59px");
          if (!st.getPropertyValue("--safe-bottom")) st.setProperty("--safe-bottom", "34px");
          /* 底孤儿条：首屏就要沥青，否则白/黑闪一下 */
          if (standalone) {
            root.style.backgroundColor = "#0d0d0f";
            root.style.height = "100vh";
            root.style.minHeight = "100vh";
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest?v=3132" />
    <link rel="icon" href="./favicon.svg?v=3132" type="image/svg+xml" />
    <!-- iOS 主屏图标：用 App 同款涂鸦 S PNG（192 足够 iOS 缩放合成；SVG 在部分 iOS 版本 apple-touch-icon 不生效） -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png?v=3132" />
