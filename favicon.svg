<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SurDance">
  <!-- 背景：硬边圆角方块，沥青黑 -->
  <rect width="64" height="64" rx="14" fill="#0d0d0f"/>
  <!-- 粉笔噪点纹理（与 base.css svg-noise 同语义） -->
  <g opacity="0.25" fill="#f4f0ea">
    <circle cx="6"  cy="10" r="0.9"/>
    <circle cx="12" cy="56" r="0.7"/>
    <circle cx="56" cy="8"  r="0.8"/>
    <circle cx="52" cy="54" r="0.9"/>
    <circle cx="30" cy="4"  r="0.6"/>
    <circle cx="34" cy="60" r="0.6"/>
    <circle cx="4"  cy="32" r="0.5"/>
    <circle cx="60" cy="34" r="0.5"/>
    <circle cx="20" cy="14" r="0.4"/>
    <circle cx="44" cy="50" r="0.4"/>
  </g>
  <!-- 黄色闪电涂鸦装饰（对应 App 图标黄闪） -->
  <g fill="none" stroke="#ffe14d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 37 L9 41 L18 44 L12 50"/>
    <path d="M49 20 L56 22 L51 28 L58 30"/>
  </g>
  <!-- 喷漆溅点 -->
  <g fill="#ffe14d">
    <circle cx="11" cy="34" r="1.4"/>
    <circle cx="7"  cy="38" r="0.7"/>
    <circle cx="17" cy="52" r="0.9"/>
    <circle cx="54" cy="17" r="1.1"/>
    <circle cx="58" cy="24" r="0.7"/>
    <circle cx="52" cy="33" r="0.6"/>
  </g>
  <g fill="#00f0ff">
    <circle cx="13" cy="55" r="0.9"/>
    <circle cx="9"  cy="52" r="0.5"/>
  </g>
  <g fill="#ff2d95">
    <circle cx="55" cy="11" r="0.8"/>
    <circle cx="50" cy="14" r="0.5"/>
  </g>
  <!-- 核心 S 字母：上半粉笔粉 + 下半粉笔青，粗描边涂鸦风 -->
  <!-- 上半 S（粉笔粉 #ff2d95） -->
  <path
    d="M16 22 Q16 13 28 13 Q38 13 42 18 Q46 22 46 26 L30 30 Z"
    fill="#ff2d95"
    stroke="#0d0d0f"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- 下半 S（粉笔青 #00f0ff） -->
  <path
    d="M18 34 L34 30 Q40 30 44 33 Q50 37 50 45 Q50 53 38 53 Q26 53 22 48 Q19 45 19 42 Z"
    fill="#00f0ff"
    stroke="#0d0d0f"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- 粉笔高光描边（强化街头感） -->
  <path
    d="M19 21 Q22 15 30 15"
    fill="none"
    stroke="#fff0f7"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.55"
  />
  <path
    d="M28 47 Q34 51 45 50"
    fill="none"
    stroke="#e5ffff"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.55"
  />
</svg>
